name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install test dependencies
        run: python -m pip install pytest pandas numpy scikit-learn
      - name: Compile core Python sources
        run: python -m compileall -q backend tests
      - name: Import core modules
        run: python ci_import_check.py
      - name: Run tests
        run: python -m pytest -q -ra
